<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Recruider - Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  /* Corporate Minimalism Ink Display */
  --ink: #0B0D12;
  --ink-soft: #141721;
  --ink-softer: #1E2333;
  --paper: #F8FAF9;
  --paper-dim: #E2E8E5;
  --paper-line: rgba(11, 13, 18, 0.12);
  --graphite: #7E879B;
  --line: rgba(255, 255, 255, 0.08);

  /* Bright Pastel Accents */
  --amber: #B4E666; /* Bright Pastel Lime */
  --amber-soft: rgba(180, 230, 102, 0.15);
  --green: #8BE9FD; /* Bright Pastel Cyan */
  --green-soft: rgba(139, 233, 253, 0.15);
  --coral: #FF79C6; /* Bright Pastel Pink */
  --coral-soft: rgba(255, 121, 198, 0.15);
  --lavender: #BD93F9; /* Bright Pastel Purple */
  --lavender-soft: rgba(189, 147, 249, 0.15);

  --font-d: 'Space Grotesk', sans-serif;
  --font-b: 'Plus Jakarta Sans', sans-serif;
  --font-m: 'JetBrains Mono', monospace;
  --radius: 12px;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--ink);
  color: var(--paper);
  font-family: var(--font-b);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}

::selection { background: var(--amber); color: var(--ink); }
button { font-family: var(--font-b); cursor: pointer; }
input, select, textarea { font-family: var(--font-b); }
a { color: inherit; }

.eyebrow {
  font-family: var(--font-m);
  text-transform: uppercase;
  letter-spacing: 0.12em;
  font-size: 11px;
  color: var(--graphite);
}
h1, h2, h3, h4 { font-family: var(--font-d); margin: 0; letter-spacing: -0.01em; }

/* Landing */
.landing {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 48px 24px;
  position: relative;
  overflow: hidden;
}
.landing::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image: 
    radial-gradient(circle at 18% 22%, rgba(180, 230, 102, 0.08), transparent 40%),
    radial-gradient(circle at 82% 78%, rgba(189, 147, 249, 0.08), transparent 42%);
  pointer-events: none;
}
.landing-mark {
  font-family: var(--font-m);
  font-size: 12px;
  letter-spacing: 0.3em;
  color: var(--amber);
  text-transform: uppercase;
  margin-bottom: 18px;
}
.landing h1 {
  font-size: clamp(40px, 7vw, 72px);
  text-align: center;
  line-height: 0.98;
  max-width: 820px;
}
.landing h1 span { color: var(--amber); }
.landing p.sub {
  color: var(--graphite);
  max-width: 520px;
  text-align: center;
  margin: 18px 0 44px;
  font-size: 15px;
  line-height: 1.6;
}
.role-grid {
  display: flex;
  gap: 18px;
  flex-wrap: wrap;
  justify-content: center;
  max-width: 920px;
  z-index: 1;
}
.role-card {
  width: 250px;
  background: var(--ink-soft);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 26px 22px;
  text-align: left;
  transition: .18s ease;
  position: relative;
  overflow: hidden;
}
.role-card:hover { border-color: var(--amber); transform: translateY(-3px); }
.role-card .num { font-family: var(--font-m); color: var(--graphite); font-size: 12px; }
.role-card h3 { font-size: 22px; margin: 10px 0 8px; }
.role-card p { color: var(--graphite); font-size: 13px; line-height: 1.5; margin: 0 0 18px; }

/* Buttons & Fields */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border-radius: 999px;
  border: 1px solid var(--line);
  padding: 11px 20px;
  background: transparent;
  color: var(--paper);
  font-weight: 600;
  font-size: 13.5px;
  transition: .15s ease;
  white-space: nowrap;
}
.btn:hover { border-color: var(--paper); }
.btn-primary { background: var(--amber); border-color: var(--amber); color: var(--ink); }
.btn-primary:hover { background: #c5f478; border-color: #c5f478; }
.btn-block { width: 100%; }
.btn-sm { padding: 7px 14px; font-size: 12.5px; }
.btn-ghost { border-color: transparent; color: var(--graphite); }
.btn-ghost:hover { color: var(--paper); border-color: var(--line); }
.btn-danger { border-color: var(--coral); color: var(--coral); }
.btn-danger:hover { background: var(--coral-soft); }
.btn-ok { border-color: var(--green); color: var(--green); }
.btn-ok:hover { background: var(--green-soft); }
.btn:disabled { opacity: .4; cursor: not-allowed; }

.field { margin-bottom: 16px; text-align: left; }
.field label {
  display: block;
  font-family: var(--font-m);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: var(--graphite);
  margin-bottom: 7px;
}
.field input, .field select, .field textarea {
  width: 100%;
  background: var(--ink-softer);
  border: 1px solid var(--line);
  color: var(--paper);
  border-radius: 10px;
  padding: 11px 13px;
  font-size: 14px;
  outline: none;
  transition: .15s;
}
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--amber); }
.field textarea { resize: vertical; min-height: 90px; line-height: 1.5; }

.auth-box {
  background: var(--ink-soft);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 34px;
  width: 100%;
  max-width: 400px;
  z-index: 1;
}
.auth-tabs {
  display: flex;
  gap: 6px;
  background: var(--ink-softer);
  border-radius: 999px;
  padding: 4px;
  margin-bottom: 22px;
}
.auth-tabs button {
  flex: 1;
  border: none;
  background: transparent;
  color: var(--graphite);
  border-radius: 999px;
  padding: 9px;
  font-weight: 600;
  font-size: 13px;
}
.auth-tabs button.active { background: var(--amber); color: var(--ink); }

.quick-login-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 12px;
  margin-bottom: 8px;
}
.avatar {
  width: 34px;
  height: 34px;
  border-radius: 10px;
  background: var(--amber-soft);
  color: var(--amber);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-d);
  font-weight: 700;
  flex-shrink: 0;
}

/* App Shell */
.app-shell { display: flex; min-height: 100vh; }
.sidebar {
  width: 236px;
  flex-shrink: 0;
  background: var(--ink-soft);
  border-right: 1px solid var(--line);
  padding: 22px 16px;
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
}
.brand {
  font-family: var(--font-d);
  font-weight: 700;
  font-size: 19px;
  letter-spacing: -0.02em;
  padding: 6px 8px 20px;
}
.brand span { color: var(--amber); }
.side-user {
  display: flex;
  gap: 10px;
  align-items: center;
  padding: 10px 8px;
  margin-bottom: 18px;
  border-bottom: 1px solid var(--line);
  padding-bottom: 18px;
}
.side-user .name { font-weight: 600; font-size: 14px; }
.side-user .role {
  font-family: var(--font-m);
  font-size: 10.5px;
  color: var(--graphite);
  text-transform: uppercase;
  letter-spacing: .06em;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: 10px;
  color: var(--graphite);
  font-size: 13.5px;
  font-weight: 600;
  margin-bottom: 3px;
  border: 1px solid transparent;
  background: transparent;
  width: 100%;
  text-align: left;
}
.nav-item:hover { color: var(--paper); }
.nav-item.active {
  background: var(--amber-soft);
  color: var(--amber);
  border-color: rgba(180, 230, 102, 0.3);
}
.sidebar-foot { margin-top: auto; padding-top: 16px; border-top: 1px solid var(--line); }

.main { flex: 1; min-width: 0; padding: 30px 40px 60px; }
.page-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 26px;
  flex-wrap: wrap;
}
.page-head h2 { font-size: 26px; }
.page-head .desc { color: var(--graphite); font-size: 13.5px; margin-top: 6px; max-width: 520px; }

.tabbar {
  display: flex;
  gap: 6px;
  background: var(--ink-soft);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 4px;
  width: fit-content;
  margin-bottom: 24px;
}
.tabbar button {
  border: none;
  background: transparent;
  color: var(--graphite);
  padding: 8px 16px;
  border-radius: 999px;
  font-weight: 600;
  font-size: 13px;
}
.tabbar button.active { background: var(--amber); color: var(--ink); }

/* Dossier Card Deck */
.deck-wrap { display: flex; flex-direction: column; align-items: center; gap: 22px; }
.deck { position: relative; width: 100%; max-width: 420px; height: 520px; touch-action: pan-y; }
.dossier-card {
  position: absolute;
  inset: 0;
  background: var(--paper);
  color: var(--ink);
  border-radius: 20px;
  padding: 24px 24px 22px;
  box-shadow: 0 18px 40px rgba(0,0,0,0.35);
  display: flex;
  flex-direction: column;
  touch-action: none;
  user-select: none;
  cursor: grab;
}
.dossier-card.behind { transform: translateY(14px) scale(0.96); box-shadow: 0 8px 20px rgba(0,0,0,0.25); z-index: 1; }
.dossier-card.top { z-index: 2; }
.stamp {
  position: absolute;
  top: 18px;
  right: 18px;
  width: 58px;
  height: 58px;
  border-radius: 50%;
  border: 2px solid var(--ink);
  color: var(--ink);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  transform: rotate(-10deg);
  font-family: var(--font-m);
  text-align: center;
  line-height: 1.05;
  background: rgba(11, 13, 18, 0.04);
}
.stamp b { font-size: 15px; font-family: var(--font-d); }
.stamp small { font-size: 8px; letter-spacing: .05em; text-transform: uppercase; }

.sector-pill {
  display: inline-block;
  font-family: var(--font-m);
  font-size: 10.5px;
  text-transform: uppercase;
  letter-spacing: .08em;
  background: var(--ink);
  color: var(--paper);
  padding: 5px 10px;
  border-radius: 999px;
  width: fit-content;
  margin-bottom: 14px;
}
.dossier-card h3 { font-size: 22px; color: var(--ink); margin-bottom: 2px; max-width: 76%; }
.dossier-card .card-sub { font-size: 13.5px; color: #57584f; margin-bottom: 14px; }
.perforation { border-top: 1.5px dashed var(--paper-line); margin: 14px 0; position: relative; }
.card-meta { display: flex; gap: 14px; flex-wrap: wrap; font-family: var(--font-m); font-size: 11px; color: #5c5d52; margin-bottom: 12px; }
.card-desc { font-size: 13.5px; line-height: 1.55; color: #3c3d34; flex: 1; overflow: hidden; }
.skill-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.skill-tag { background: var(--paper-dim); border-radius: 999px; padding: 4px 10px; font-size: 11px; font-family: var(--font-m); color: #4a4b41; }
.card-actions { display: flex; gap: 10px; margin-top: 16px; }

.swipe-btn {
  flex: 1;
  border-radius: 14px;
  border: 1.5px solid var(--paper-line);
  background: transparent;
  color: var(--ink);
  padding: 12px;
  font-weight: 700;
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.swipe-btn.pass { border-color: #e0529c; color: #d03080; }
.swipe-btn.pass:hover { background: var(--coral-soft); }
.swipe-btn.like { border-color: #00aa88; color: #008866; }
.swipe-btn.like:hover { background: var(--green-soft); }

.deck-empty { text-align: center; color: var(--graphite); padding: 60px 20px; border: 1px dashed var(--line); border-radius: 20px; }
.deck-hint { font-family: var(--font-m); font-size: 11px; color: var(--graphite); text-transform: uppercase; letter-spacing: .08em; }

/* Lists & Rows */
.search-row { display: flex; gap: 10px; margin-bottom: 20px; max-width: 520px; }
.search-row input { flex: 1; }
.list-row {
  display: flex;
  align-items: center;
  gap: 16px;
  background: var(--ink-soft);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 16px 18px;
  margin-bottom: 10px;
  transition: .15s;
}
.list-row:hover { border-color: var(--amber); }
.list-row .lr-stamp {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 1.5px solid var(--amber);
  color: var(--amber);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-d);
  font-weight: 700;
  font-size: 13px;
  flex-shrink: 0;
}
.list-row .lr-main { flex: 1; min-width: 0; }
.list-row .lr-main h4 { font-family: var(--font-d); font-size: 15.5px; margin: 0 0 3px; }
.list-row .lr-main .lr-sub { font-size: 12.5px; color: var(--graphite); }
.list-row .lr-meta { font-family: var(--font-m); font-size: 10.5px; color: var(--graphite); margin-top: 5px; text-transform: uppercase; letter-spacing: .04em; }

.company-card {
  background: var(--ink-soft);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 20px;
  cursor: pointer;
  transition: .15s;
  width: 220px;
}
.company-card:hover { border-color: var(--amber); transform: translateY(-2px); }
.company-card h4 { font-family: var(--font-d); font-size: 16px; margin: 0 0 6px; }
.company-card .lr-meta { font-family: var(--font-m); font-size: 10.5px; color: var(--graphite); text-transform: uppercase; }
.grid-companies { display: flex; flex-wrap: wrap; gap: 14px; }

/* Modals */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(10, 11, 16, 0.72);
  backdrop-filter: blur(3px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 50;
  padding: 24px;
}
.modal {
  background: var(--paper);
  color: var(--ink);
  border-radius: 22px;
  max-width: 520px;
  width: 100%;
  max-height: 88vh;
  overflow-y: auto;
  padding: 28px 30px 30px;
  position: relative;
}
.modal-close {
  position: absolute;
  top: 18px;
  right: 18px;
  background: var(--paper-dim);
  border: none;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  font-size: 16px;
  color: var(--ink);
  cursor: pointer;
}
.modal h3 { font-size: 24px; margin-bottom: 4px; padding-right: 30px; }
.modal .m-sub { color: #57584f; font-size: 13.5px; margin-bottom: 16px; }
.portfolio-block { background: var(--paper-dim); border-radius: 14px; padding: 16px 18px; margin: 14px 0; }
.portfolio-block p { font-size: 13.5px; line-height: 1.6; color: #3c3d34; margin: 0; }
.badge-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--amber-soft);
  color: var(--amber);
  border-radius: 999px;
  padding: 5px 12px;
  font-size: 11.5px;
  font-family: var(--font-m);
  margin: 0 6px 6px 0;
}
.sub-item { border-left: 2px solid var(--amber); padding: 8px 0 8px 12px; margin-bottom: 10px; }
.sub-item .sub-title { font-weight: 700; font-size: 13px; }
.sub-item .sub-text { font-size: 12.5px; color: var(--graphite); margin-top: 3px; line-height: 1.5; }

/* Panels & Layout */
.panel { background: var(--ink-soft); border: 1px solid var(--line); border-radius: 18px; padding: 24px 26px; margin-bottom: 20px; }
.panel h3 { font-size: 16px; margin-bottom: 14px; }
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.stat-row { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 20px; }
.stat-box { background: var(--ink-soft); border: 1px solid var(--line); border-radius: 14px; padding: 16px 20px; min-width: 120px; }
.stat-box .val { font-family: var(--font-d); font-size: 26px; color: var(--amber); }
.stat-box .lbl { font-family: var(--font-m); font-size: 10.5px; text-transform: uppercase; color: var(--graphite); letter-spacing: .06em; margin-top: 2px; }
.sector-group { margin-bottom: 22px; }
.sector-group h4 { font-family: var(--font-m); text-transform: uppercase; letter-spacing: .08em; font-size: 11.5px; color: var(--amber); margin-bottom: 10px; }
.empty-note { color: var(--graphite); font-size: 13px; padding: 16px 0; }

/* Chat */
.match-row { display: flex; align-items: center; gap: 14px; background: var(--ink-soft); border: 1px solid var(--line); border-radius: 14px; padding: 14px 18px; margin-bottom: 10px; cursor: pointer; }
.match-row:hover { border-color: var(--amber); }
.chat-shell { display: flex; gap: 20px; height: 560px; }
.chat-list { width: 260px; flex-shrink: 0; overflow-y: auto; }
.chat-panel { flex: 1; background: var(--ink-soft); border: 1px solid var(--line); border-radius: 18px; display: flex; flex-direction: column; overflow: hidden; }
.chat-head { padding: 16px 20px; border-bottom: 1px solid var(--line); }
.chat-head h4 { font-family: var(--font-d); font-size: 15px; }
.chat-body { flex: 1; overflow-y: auto; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; }
.bubble { max-width: 70%; padding: 10px 14px; border-radius: 14px; font-size: 13.5px; line-height: 1.45; }
.bubble.me { align-self: flex-end; background: var(--amber); color: var(--ink); border-bottom-right-radius: 4px; font-weight: 500; }
.bubble.them { align-self: flex-start; background: var(--ink-softer); border-bottom-left-radius: 4px; }
.bubble .ts { display: block; font-family: var(--font-m); font-size: 9.5px; opacity: .6; margin-top: 4px; }
.chat-input { display: flex; gap: 10px; padding: 14px 16px; border-top: 1px solid var(--line); }
.chat-input input { flex: 1; }
.chat-empty { display: flex; align-items: center; justify-content: center; height: 100%; color: var(--graphite); font-size: 13.5px; }

/* Data Tables */
table.data-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.data-table th { text-align: left; font-family: var(--font-m); text-transform: uppercase; letter-spacing: .05em; font-size: 10.5px; color: var(--graphite); padding: 8px 10px; border-bottom: 1px solid var(--line); }
table.data-table td { padding: 9px 10px; border-bottom: 1px solid var(--line); }

.toast {
  position: fixed;
  bottom: 26px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--amber);
  color: var(--ink);
  padding: 12px 22px;
  border-radius: 999px;
  font-weight: 700;
  font-size: 13px;
  z-index: 100;
  box-shadow: 0 10px 30px rgba(0,0,0,.3);
  animation: toastin .18s ease;
}
@keyframes toastin { from { opacity: 0; transform: translate(-50%, 10px); } to { opacity: 1; transform: translate(-50%, 0); } }

@media (max-width: 860px) {
  .app-shell { flex-direction: column; }
  .sidebar { width: 100%; height: auto; position: relative; flex-direction: row; align-items: center; overflow-x: auto; padding: 14px; }
  .sidebar-foot { margin: 0 0 0 auto; padding: 0; border: none; }
  .side-user { border: none; margin: 0; padding: 0 10px; }
  .brand { padding: 0 12px 0 0; }
  .nav-item { white-space: nowrap; }
  .main { padding: 22px 16px 60px; }
  .two-col { grid-template-columns: 1fr; }
  .chat-shell { flex-direction: column; height: auto; }
  .chat-list { width: 100%; }
}
</style>
</head>
<body>
<div id="root"></div>
<script>
/* ===== DATA ===== */
function uid() { return 'id' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function initials(name) { return (name || '').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase(); }
function timeNow() { return new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}); }

const DB = {
  candidates: [

/* ===== HELPERS ===== */
function me() {
  if (session.role === 'admin') return { name: 'Admin User', company: 'Platform Admin' };
  return session.role === 'candidate'
    ? DB.candidates.find(c => c.id === session.userId)
    : session.role === 'recruiter' ? DB.recruiters.find(r => r.id === session.userId) : null;
}
function jobById(id) { return DB.jobs.find(j => j.id === id); }
function candById(id) { return DB.candidates.find(c => c.id === id); }
function recById(id) { return DB.recruiters.find(r => r.id === id); }
function badgeById(id) { return DB.badgesCatalog.find(b => b.id === id); }

function companiesList() {
  const map = {};
  DB.jobs.forEach(j => {
    if (!map[j.company]) map[j.company] = { company: j.company, sector: j.sector, recruiterId: j.recruiterId, count: 0 };
    map[j.company].count++;
  });
  return Object.values(map);
}

function toast(msg) {
  session.toast = msg;
  render();
  setTimeout(() => { session.toast = null; render(); }, 1800);
}

function tryMatch(candidateId, jobId) {
  const job = jobById(jobId); if (!job) return;
  const recruiterId = job.recruiterId;
  const cOk = DB.swipesC[candidateId] && DB.swipesC[candidateId][jobId] === 'interested';
  const rEntry = DB.swipesR[recruiterId] && DB.swipesR[recruiterId][candidateId];
  const rOk = rEntry && rEntry.decision === 'interested' && rEntry.jobId === jobId;
  if (cOk && rOk) {
    const exists = DB.matches.find(m => m.candidateId === candidateId && m.jobId === jobId);
    if (!exists) {
      DB.matches.push({ id: uid(), candidateId, jobId, recruiterId, chat: [] });
      toast('It is a match! Chat unlocked.');
    }
  }
}

function candidateSwipe(jobId, decision) {
  const cid = session.userId;
  DB.swipesC[cid] = DB.swipesC[cid] || {};
  DB.swipesC[cid][jobId] = decision;
  if (decision === 'interested') tryMatch(cid, jobId);
  render();
}

function recruiterDecide(candidateId, decision, jobId) {
  const rid = session.userId;
  DB.swipesR[rid] = DB.swipesR[rid] || {};
  DB.swipesR[rid][candidateId] = { decision, jobId: jobId || null };
  if (decision === 'interested' && jobId) tryMatch(candidateId, jobId);
  render();
}

function matchScore(seed) {
  let h = 0;
  for (let i = 0; i < seed.length; i++) h = (h * 31 + seed.charCodeAt(i)) >>> 0;
  return 72 + (h % 26);
}

function jobDeckHtml(cid) {
  const undecided = DB.jobs.filter(j => !(DB.swipesC[cid] && DB.swipesC[cid][j.id]));
  if (undecided.length === 0) {
    return `<div class="deck-empty">You've been through every open role.<br/>Check back later or revisit your matches.</div>`;
  }
  const top = undecided[0], second = undecided[1];
  const cardHtml = (job, cls, score) => `
    <div class="dossier-card ${cls}" ${cls === 'top' ? 'id="topCard"' : ''} data-swipe-id="${job.id}">
      <div class="stamp"><b>${score}%</b><small>match</small></div>
      <div class="sector-pill">${job.sector}</div>
      <h3>${job.title}</h3>
      <div class="card-sub">${job.company} • ${job.location}</div>
      <div class="perforation"></div>
      <div class="card-meta"><span>${job.pay}</span><span>•</span><span>${job.location}</span></div>
      <div class="card-desc">${job.blurb}</div>
      <div class="card-actions">
        <button class="swipe-btn pass" onclick="candidateSwipe('${job.id}', 'pass')">✕ Not interested</button>
        <button class="swipe-btn like" onclick="candidateSwipe('${job.id}', 'interested')">♥ Interested</button>
      </div>
    </div>`;
  return `
    ${second ? cardHtml(second, 'behind', matchScore(second.id + cid)) : ''}
    ${cardHtml(top, 'top', matchScore(top.id + cid))}
  `;
}

function candDeckHtml(rid) {
  const undecided = DB.candidates.filter(c => !(DB.swipesR[rid] && DB.swipesR[rid][c.id]));
  if (undecided.length === 0) {
    return `<div class="deck-empty">You've reviewed every candidate.<br/>Check back later or revisit your matches.</div>`;
  }
  const top = undecided[0], second = undecided[1];
  const cardHtml = (c, cls, score) => `
    <div class="dossier-card ${cls}" ${cls === 'top' ? 'id="topCard"' : ''} data-swipe-id="${c.id}">
      <div class="stamp"><b>${score}%</b><small>fit</small></div>
      <div class="sector-pill">${c.sector}</div>
      <h3>${c.name}</h3>
      <div class="card-sub">${c.skills.slice(0,3).join(' • ') || 'Skills not listed'}</div>
      <div class="perforation"></div>
      <div class="card-desc">${c.bio}</div>
      <div class="skill-tags">${c.badges.map(b => `<span class="skill-tag">★ ${badgeById(b)?.name || b}</span>`).join('')}</div>
      <div class="card-actions">
        <button class="swipe-btn pass" onclick="recruiterDecide('${c.id}', 'pass', null); render()">✕ Not interested</button>
        <button class="swipe-btn like" onclick="openPositionPicker('${c.id}')">♥ Interested</button>
      </div>
      <button class="btn btn-ghost btn-sm" style="margin-top:8px;" onclick="openPortfolio('${c.id}')">See portfolio →</button>
    </div>`;
  return `
    ${second ? cardHtml(second, 'behind', matchScore(second.id + rid)) : ''}
    ${cardHtml(top, 'top', matchScore(top.id + rid))}
  `;
}

function postAdminChallenge(e) {
  e.preventDefault();
  const f = e.target;
  DB.challenges.push({ id: uid(), postedBy: 'admin', title: f.title.value, sector: f.sector.value, desc: f.desc.value, archived: false });
  toast('Challenge posted.');
  goto('admin-challenges');
}

function challengeStatus(ch) {
  const subs = DB.submissions.filter(s => s.challengeId === ch.id);
  return { submissions: subs.length, reviewed: subs.filter(s => s.reviewed).length, pending: subs.filter(s => !s.reviewed).length };
}

function deleteChallenge(chalId) {
  const ch = DB.challenges.find(x => x.id === chalId);
  if (!ch) return;
  const hasSubs = DB.submissions.some(s => s.challengeId === chalId);
  if (hasSubs) {
    toast('Cannot delete a challenge with submissions. Archive it instead.');
    return;
  }
  DB.challenges = DB.challenges.filter(x => x.id !== chalId);
  toast('Challenge deleted.');
  render();
}

function archiveChallenge(chalId) {
  const ch = DB.challenges.find(x => x.id === chalId);
  if (!ch) return;
  ch.archived = !ch.archived;
  toast(ch.archived ? 'Challenge archived.' : 'Challenge restored.');
  render();
}

function toggleReview(subId) {
  const s = DB.submissions.find(x => x.id === subId);
  if (s) s.reviewed = !s.reviewed;
  render();
}

/* ===== MATCHES & CHAT ===== */
function matchesAndChatHtml(role) {
  const uidCur = session.userId;
  const mine = role === 'candidate' ? DB.matches.filter(m => m.candidateId === uidCur) : DB.matches.filter(m => m.recruiterId === uidCur);
  const active = session.activeMatchId && mine.find(m => m.id === session.activeMatchId);
  const list = mine.map(m => {
    const other = role === 'candidate' ? recById(m.recruiterId) : candById(m.candidateId);
    const otherLabel = role === 'candidate' ? (other?.company || 'Company') : (other?.name || 'Candidate');
    const job = jobById(m.jobId);
    return `
      <div class="match-row" onclick="session.activeMatchId='${m.id}';render()" style="${active && active.id === m.id ? 'border-color:var(--amber);' : ''}">
        <div class="avatar">${initials(otherLabel)}</div>
        <div>
          <div style="font-weight:600;font-size:13.5px;">${otherLabel}</div>
          <div style="font-size:11.5px;color:var(--graphite);">${job ? job.title : ''}</div>
        </div>
      </div>`;
  }).join('') || `<div class="empty-note">No matches yet. Swipe right on something you both like.</div>`;

  let panel = `<div class="chat-panel"><div class="chat-empty">Select a match to open the chat.</div></div>`;
  if (active) {
    const other = role === 'candidate' ? recById(active.recruiterId) : candById(active.candidateId);
    const otherLabel = role === 'candidate' ? (other?.company || 'Company') : (other?.name || 'Candidate');
    const job = jobById(active.jobId);
    panel = `
      <div class="chat-panel">
        <div class="chat-head"><h4>${otherLabel}</h4><div class="eyebrow">${job ? job.title : ''}</div></div>
        <div class="chat-body" id="chatBody">
          ${active.chat.length ? active.chat.map(m => `
            <div class="bubble ${m.from === role ? 'me' : 'them'}">${m.text}<span class="ts">${m.ts}</span></div>
          `).join('') : '<div class="chat-empty">Say hello - you matched!</div>'}
        </div>
        <div class="chat-input">
          <input id="chatInput" placeholder="Write a message..." onkeydown="if(event.key==='Enter') sendChat('${active.id}','${role}')"/>
          <button class="btn btn-primary" onclick="sendChat('${active.id}','${role}')">Send</button>
        </div>
      </div>`;
  }
  return `<div class="chat-shell"><div class="chat-list">${list}</div>${panel}</div>`;
}

function sendChat(matchId, role) {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;
  const m = DB.matches.find(x => x.id === matchId);
  if (m) {
    m.chat.push({ from: role, text, ts: timeNow() });
    input.value = '';
    render();
    setTimeout(() => { const b = document.getElementById('chatBody'); if (b) b.scrollTop = b.scrollHeight; }, 0);
  }
}

/* ===== MODALS ===== */
function openJobDetail(jobId) { session.modal = { type: 'job', jobId }; render(); }
function openCandidateDetail(candidateId) { session.modal = { type: 'candidate', candidateId }; render(); }
function openPortfolio(candidateId) { session.modal = { type: 'portfolio', candidateId }; render(); }
function closeModal() { session.modal = null; render(); }

  const m = session.modal;
  if (!m) return '';
  let inner = '';
  if (m.type === 'job') {
    const j = jobById(m.jobId);
    const cid = session.userId;
    const decided = session.role === 'candidate' && DB.swipesC[cid] && DB.swipesC[cid][j.id];
    inner = `
      <div class="sector-pill">${j.sector}</div>
      <h3>${j.title}</h3>
      <div class="m-sub">${j.company} • ${j.location} • ${j.pay}</div>
      <div class="card-desc">${j.desc}</div>
      ${session.role === 'candidate' ? `
        <div class="card-actions">
          <button class="swipe-btn pass" onclick="candidateSwipe('${j.id}','pass'); closeModal()">✕ Not interested</button>
          <button class="swipe-btn like" onclick="candidateSwipe('${j.id}','interested'); closeModal()">♥ Interested</button>
        </div>
        ${decided ? `<div class="eyebrow" style="margin-top:10px;">You already marked this: ${decided}</div>` : ''}
      ` : ''}`;
  } else if (m.type === 'candidate') {
    const c = candById(m.candidateId);
    inner = `
      <div class="sector-pill">${c.sector}</div>
      <h3>${c.name}</h3>
      <div class="m-sub">${c.skills.join(' • ') || 'No skills listed'}</div>
      <div class="portfolio-block"><p>${c.bio}</p></div>
      <button class="btn btn-ghost btn-sm" onclick="openPortfolio('${c.id}')">See full portfolio →</button>
      ${session.role === 'recruiter' ? `
        <div class="card-actions" style="margin-top:16px;">
          <button class="swipe-btn pass" onclick="recruiterDecide('${c.id}','pass', null); closeModal()">✕ Not interested</button>
          <button class="swipe-btn like" onclick="closeModal(); openPositionPicker('${c.id}')">♥ Interested</button>
        </div>
      ` : ''}`;
  } else if (m.type === 'portfolio') {
    const c = candById(m.candidateId);
    const subs = DB.submissions.filter(s => s.candidateId === c.id);
    inner = `
      <div class="sector-pill">${c.sector} portfolio</div>
      <h3>${c.name}</h3>
      <div class="portfolio-block"><p>${c.bio}</p></div>
      <div class="eyebrow" style="margin:16px 0 8px;">Badges</div>
      ${c.badges.length ? c.badges.map(bid => `<span class="badge-chip">★ ${badgeById(bid)?.name}</span>`).join('') : `<div class="empty-note">No badges yet.</div>`}
      <div class="eyebrow" style="margin:16px 0 8px;">Challenges completed</div>
      ${subs.length ? subs.map(s => `
        <div class="sub-item"><div class="sub-title">${DB.challenges.find(ch => ch.id === s.challengeId)?.title}</div><div class="sub-text">${s.text}</div></div>
      `).join('') : '<div class="empty-note">No completed challenges yet.</div>'}`;
  } else if (m.type === 'positionPicker') {
    inner = `
      <h3>Which position is this for?</h3>
      <div class="m-sub">Choose one of your open roles to send interest with.</div>
      ${m.myJobs.length ? m.myJobs.map(j => `
        <div class="list-row" style="cursor:pointer;" onclick="confirmPosition('${m.candidateId}','${j.id}')">
          <div class="lr-stamp">${initials(j.title)}</div>
          <div class="lr-main"><h4>${j.title}</h4><div class="lr-sub">${j.sector} • ${j.location}</div></div>
        </div>
      `).join('') : `<div class="empty-note">Post a job first before showing interest.</div>`}`;
  }
  return `
    <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
      <div class="modal"><button class="modal-close" onclick="closeModal()">×</button>${inner}</div>
    </div>`;
}

/* ===== DRAG (top swipe card) ===== */
function attachDrag() {
  const card = document.getElementById('topCard');
  if (!card) return;
  if (card._cleanup) card._cleanup();

  let startX = 0, startY = 0, curX = 0, dragging = false, pointerId = null;

  const onDown = (e) => {
    if (e.target.closest('button, a, input, textarea, select')) return;
    dragging = true;
    pointerId = e.pointerId;
    startX = e.clientX;
    startY = e.clientY;
    curX = 0;
    card.style.transition = 'none';
    card.style.cursor = 'grabbing';
    try { card.setPointerCapture(pointerId); } catch (_) {}
  };

  const onMove = (e) => {
    if (!dragging || e.pointerId !== pointerId) return;
    curX = e.clientX - startX;
    const dy = (e.clientY - startY) * 0.2;
    card.style.transform = `translate(${curX}px, ${dy}px) rotate(${curX / 18}deg)`;
  };

  const finish = () => {
    if (!dragging) return;
    dragging = false;
    card.style.cursor = 'grab';
    card.style.transition = 'transform .25s ease, opacity .25s ease';
    const cardId = card.dataset.swipeId || card.getAttribute('data-swipe-id');
    if (curX > 120) {
      card.style.transform = 'translate(650px, -40px) rotate(24deg)';
      card.style.opacity = '0';
      setTimeout(() => swipeFromCard(cardId, 'interested'), 180);
    } else if (curX < -120) {
      card.style.transform = 'translate(-650px, -40px) rotate(-24deg)';
      card.style.opacity = '0';
      setTimeout(() => swipeFromCard(cardId, 'pass'), 180);
    } else {
      card.style.transform = 'translate(0,0) rotate(0)';
      curX = 0;
      pointerId = null;
    }
  };

  const onCancel = () => {
    if (!dragging) return;
    dragging = false;
    curX = 0;
    pointerId = null;
    card.style.transition = 'transform .2s ease';
    card.style.transform = 'translate(0,0) rotate(0)';
    card.style.cursor = 'grab';
  };

  card.addEventListener('pointerdown', onDown);
  card.addEventListener('pointermove', onMove);
  card.addEventListener('pointerup', finish);
  card.addEventListener('pointercancel', onCancel);

  card._cleanup = () => {
    card.removeEventListener('pointerdown', onDown);
    card.removeEventListener('pointermove', onMove);
    card.removeEventListener('pointerup', finish);
    card.removeEventListener('pointercancel', onCancel);
  };
}

function swipeFromCard(id, decision) {
  if (!id) return;
  if (session.role === 'candidate') {
    candidateSwipe(id, decision);
  } else if (session.role === 'recruiter') {
    if (decision === 'interested') openPositionPicker(id);
    else recruiterDecide(id, 'pass', null);
  }
}

function render() {
  let html = '';
  if (session.screen === 'landing') html = renderLanding();
  else if (session.screen === 'auth') html = renderAuth();
  else if (session.screen === 'candidate-home') html = renderCandidateHome();
  else if (session.screen === 'candidate-challenges') html = renderCandidateChallenges();
  else if (session.screen === 'candidate-matches') html = renderCandidateMatches();
  else if (session.screen === 'candidate-profile') html = renderCandidateProfile();
  else if (session.screen === 'recruiter-home') html = renderRecruiterHome();
  else if (session.screen === 'recruiter-postjob') html = renderRecruiterPostJob();
  else if (session.screen === 'recruiter-postchallenge') html = renderRecruiterPostChallenge();
  else if (session.screen === 'recruiter-profile') html = renderRecruiterProfile();
  else if (session.screen === 'recruiter-matches') html = renderRecruiterMatches();
  else if (session.screen === 'admin-dashboard') html = renderAdminDashboard();
  else if (session.screen === 'admin-challenges') html = renderAdminChallenges();
  else if (session.screen === 'admin-badges') html = renderAdminBadges();
  else if (session.screen === 'admin-data') html = renderAdminData();

  html += modalHtml();
  if (session.toast) html += `<div class="toast">${session.toast}</div>`;

  document.getElementById('root').innerHTML = html;
  attachDrag();
}

render();
</script>
